baseURL = "https://sprawlingberry.com/"
title = "Sprawling Berry"
# Set this to your preferred default language.
defaultContentLanguage = "zh"
# Use folders like content/en/... and content/zh/...
defaultContentLanguageInSubdir = true

# Hugo extended is recommended (Sass/SCSS pipeline). Plain Hugo also works for this repo.
# If you use Cloudflare Pages, pick the "Hugo" framework preset or install Hugo extended.

[pagination]
  pagerSize = 12

[params]
  description = "Fiction blog"
  author = ""

# Multilingual (optional CN/EN)
[languages]
  [languages.en]
    languageName = "English"
    weight = 1
    title = "Sprawling Berry"
    [languages.en.params]
      subtitle = "Fiction"
  [languages.zh]
    languageName = "中文"
    languageCode = "zh-CN"
    weight = 2
    title = "漫莓"
    [languages.zh.params]
      subtitle = "小说"

# Clean URLs and predictable taxonomy
[permalinks]
  posts = "/:year/:month/:slug/"

[taxonomies]
  tag = "tags"
  series = "series"

# Menus are language-specific to match the hand-drawn UI
[languages.zh.menu]
  [[languages.zh.menu.main]]
    name = "诗歌"
    pageRef = "/poems"
    weight = 1
  [[languages.zh.menu.main]]
    name = "小说"
    pageRef = "/posts"
    weight = 2
  [[languages.zh.menu.main]]
    name = "绘画"
    pageRef = "/art"
    weight = 3
  [[languages.zh.menu.main]]
    name = "CG"
    pageRef = "/cg"
    weight = 4
  [[languages.zh.menu.main]]
    name = "手工"
    pageRef = "/craft"
    weight = 5
  [[languages.zh.menu.main]]
    name = "同人本"
    pageRef = "/doujin"
    weight = 6

[languages.en.menu]
  [[languages.en.menu.main]]
    name = "Poems"
    pageRef = "/poems"
    weight = 1
  [[languages.en.menu.main]]
    name = "Stories"
    pageRef = "/posts"
    weight = 2
  [[languages.en.menu.main]]
    name = "Art"
    pageRef = "/art"
    weight = 3
  [[languages.en.menu.main]]
    name = "CG"
    pageRef = "/cg"
    weight = 4
  [[languages.en.menu.main]]
    name = "Craft"
    pageRef = "/craft"
    weight = 5
  [[languages.en.menu.main]]
    name = "Doujin"
    pageRef = "/doujin"
    weight = 6

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = false
